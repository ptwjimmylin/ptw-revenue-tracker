<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTW Revenue & AR Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PTW Revenue & AR Tracker</h1>
    </header>

    <section class="dashboard">
        <div class="card">
            <h3>Total Revenue (NTD)</h3>
            <span id="revenue">0</span>
        </div>
        <div class="card">
            <h3>Pending AR (NTD)</h3>
            <span id="pending">0</span>
        </div>
        <div class="card">
            <h3>Active Projects</h3>
            <span id="projects">0</span>
        </div>
    </section>

    <section class="form">
        <div class="form-grid">
            <input type="date" id="date">
            <select id="customer">
                <option value="">Select Customer</option>
                <option>TSMC</option>
                <option>UMC</option>
                <option>Micron</option>
                <option>Nanya</option>
                <option>VIS</option>
                <option>PSMC</option>
                <option>Winbond</option>
                <option>Macronix</option>
                <option>ASE</option>
                <option>SPIL</option>
                <option>PTI</option>
                <option>KYEC</option>
            </select>
            <input type="text" id="prNo" placeholder="PR No">
            <input type="text" id="poNo" placeholder="PO No">
            <input type="text" id="invoiceNo" placeholder="Invoice No">
            <select id="category">
                <option value="">Category</option>
                <option>Project</option>
                <option>Labor</option>
                <option>Service Labor</option>
                <option>Parts</option>
                <option>Repair</option>
                <option>Install</option>
                <option>Training</option>
                <option>Upgrade</option>
            </select>
            <input type="text" id="description" placeholder="Description">
            <input type="number" id="qty" value="1" min="1" placeholder="Qty">
            <input type="number" id="unitPrice" value="0" min="0" placeholder="Unit Price">
            <select id="paidStatus">
                <option value="Paid">Paid</option>
                <option value="Pending" selected>Pending</option>
                <option value="Partial">Partial</option>
            </select>
            <select id="status">
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
            <select id="owner">
                <option value="">Select Owner</option>
                <option>Jimmy</option>
                <option>Jason</option>
                <option>Steven</option>
            </select>
        </div>
        <button type="button" id="submitBtn" onclick="saveRecord()">Save Record</button>
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>PR No</th>
                    <th>PO No</th>
                    <th>Invoice No</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Total Amount</th>
                    <th>Paid Status</th>
                    <th>Status</th>
                    <th>Owner</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="records">
                <tr><td colspan="12" style="text-align:center;">Loading data...</td></tr>
            </tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
